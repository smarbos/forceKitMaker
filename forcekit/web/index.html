<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>forcekit</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="top">
  <strong>forcekit</strong>
  <span id="status" class="status" role="status"></span>
  <button id="settings-open" type="button" class="settings-btn" title="Force connection settings">⚙ Settings</button>
</header>
<section id="settings" class="settings" hidden aria-label="Settings">
  <div class="settings-grid">
    <label>Force IP address <input id="force-host" type="text" spellcheck="false" placeholder="192.168.0.27"></label>
    <label>User <input id="force-user" type="text" spellcheck="false" placeholder="root"></label>
    <label>Folder on the Force <input id="force-dir" type="text" spellcheck="false" placeholder="/media/…/forcekit"></label>
  </div>
  <div class="row">
    <button id="settings-test" type="button">Test connection</button>
    <button id="settings-save" type="button" class="primary">Save</button>
    <button id="settings-close" type="button">Close</button>
    <span id="settings-result" class="small"></span>
  </div>
  <p class="muted small">Sending uses your SSH key (no password is stored). Kits go to &lt;folder&gt;/Drums/&lt;name&gt;/ and &lt;folder&gt;/Synths/&lt;name&gt;/.</p>
</section>
<main class="cols">
  <section class="col" aria-label="Folders">
    <input id="tree-filter" type="search" placeholder="Filter folders">
    <div id="tree" class="tree"></div>
  </section>
  <section class="col" aria-label="Samples">
    <div class="row">
      <input id="file-filter" type="search" placeholder="Filter samples">
      <select id="hint-filter" aria-label="Type"><option value="">all types</option></select>
      <label class="small" title="Hide loops and files longer than 4 s"><input id="one-shots" type="checkbox"> Hide loops &amp; long</label>
    </div>
    <div id="folder-title" class="muted"></div>
    <div id="files" class="files" tabindex="0"></div>
    <p class="muted small">↑/↓ play · Space replay · Enter / double-click / drag to assign · [ / ] swap pad sound</p>
  </section>
  <section class="col" id="program" aria-label="Program">
    <div class="row">
      <div class="seg" role="group" aria-label="Program type">
        <button id="type-drum" type="button">Drum</button>
        <button id="type-synth" type="button">Synth</button>
      </div>
      <button id="new-program" type="button" title="Start a new empty program of this type">New</button>
      <select id="drafts" aria-label="Drafts"></select>
      <button id="delete-draft" type="button" title="Delete this draft">Delete</button>
    </div>
    <input id="program-name" type="text" aria-label="Program name">
    <div id="drum-panel">
      <button id="autofill" type="button" class="wide" title="New kit from the open folder and its subfolders, in the standard layout">Auto-fill kit from this folder</button>
      <div id="pads" class="pads" aria-label="Pads, laid out like the Force: bank A bottom-left, B bottom-right, C top-left, D top-right"></div>
      <div id="pad-info" class="pad-info"></div>
    </div>
    <div id="synth-panel" hidden>
      <div id="keymap" class="keymap" aria-hidden="true"></div>
      <div id="synth-list" class="synth-list"></div>
    </div>
    <div class="row export-row">
      <label><input id="normalize" type="checkbox" checked> Normalize</label>
      <span class="row">
        <span id="export-area"><button id="export" type="button" class="primary">Export</button></span>
        <span id="send-area"><button id="send" type="button" class="primary">Send to Force</button></span>
      </span>
    </div>
    <div id="export-result" class="small"></div>
  </section>
</main>
<audio id="player" preload="auto"></audio>
<script src="/static/app.js"></script>
</body>
</html>
